<!DOCTYPE html>
<html lang="en" class="h-full bg-[#f2f6f3] m-0 p-0">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the remembered appearance before the first paint (same key as src/theme/ThemeContext.jsx): 'dark', or 'system'
      // while the operating system prefers dark. The signed-in user's saved preference replaces it once their profile loads.
      try {
        var remembered = localStorage.getItem('taskotel-theme');
        if (remembered === 'dark' || (remembered === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/taskotel-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Taskotel — Hotel Operations, Simplified. Balanced workloads. Smarter operations." />
    <meta name="application-name" content="Taskotel" />
    <title>Taskotel — Hotel Operations, Simplified</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="m-0 p-0 min-h-full font-sans antialiased bg-[#f2f6f3] text-gray-900">
    <div id="root" class="min-h-full"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
