# Continuous integration: runs the tests and lint on every pull request and every push to main.
# It never deploys: Vercel and Render deploy from main on their own, after this check has had its chance to fail the merge.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Java 25, Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # mvnw can be checked out with Windows (CRLF) line endings, which Linux cannot run (the Dockerfile does the same)
      - name: Make the Maven wrapper runnable
        run: sed -i 's/\r$//' mvnw && chmod +x mvnw
      # The tests use an in-memory H2 database and need no secrets, no PostgreSQL and no external service
      - name: Run all backend tests
        run: ./mvnw -B -ntp test

  frontend:
    name: Frontend tests, lint and build (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Tests
        run: npm test
      - name: Lint
        run: npm run lint
      # A production build catches errors that only appear when bundling; the result is not published anywhere
      - name: Production build
        run: npm run build
